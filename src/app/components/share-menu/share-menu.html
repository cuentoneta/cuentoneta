<button
	[attr.aria-expanded]="isOpen()"
	[attr.popovertarget]="panelId"
	[id]="triggerId"
	aria-haspopup="menu"
	cuentoneta-button
	size="xs"
	type="button"
	variant="subtle"
>
	{{ triggerLabel() }}
</button>

<div
	(keydown)="onKeydown($event)"
	(toggle)="onToggle($event)"
	[attr.aria-labelledby]="triggerId"
	[id]="panelId"
	#panel
	class="share-menu-panel hidden flex-col gap-3.5 rounded-xl bg-neutral-100 p-3.5 py-3 shadow-lg open:flex"
	popover="auto"
	role="menu"
	tabindex="-1"
>
	@for (destination of destinations; track destination.id) {
	<button
		(click)="activate(destination)"
		[attr.tabindex]="activeIndex() === $index ? 0 : -1"
		#option
		class="flex cursor-pointer items-center gap-2 rounded font-inter text-xs font-semibold text-neutral-900 hover:bg-neutral-200 focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500 focus-visible:ring-offset-2 focus-visible:ring-offset-neutral-100"
		role="menuitem"
		type="button"
	>
		<ng-icon [name]="destination.iconName" size="18" aria-hidden="true" />
		{{ destination.label }}
	</button>
	}
</div>

<p class="sr-only" role="status">{{ copyAnnouncement() }}</p>
