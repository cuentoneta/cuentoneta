# Convierte el mínimo de `engines.node` en una barrera de instalación y no solo en documentación.
# El hook de edición corre con `node` puro y depende del type-stripping del runtime: sin esto, una
# máquina por debajo del piso instala igual y el guardarraíl degrada en abierto, sin aviso.
engineStrict: true

# Dependencias autorizadas a correr scripts de instalación; las que figuran en `false` se instalan sin
# ellos porque no los necesitan para funcionar.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false

overrides:
  'postcss@8': '>=8.5.10 <9'
  'fflate@0': '>=0.7.5 <1'
