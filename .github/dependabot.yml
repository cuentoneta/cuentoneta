version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Martes para esquivar el pico de PRs de Dependabot de los lunes.
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps-ci)'

  # package-ecosystem: npm es el valor correcto para pnpm: Dependabot no tiene
  # ecosystem "pnpm"; detecta pnpm-lock.yaml y respeta packageManager.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # La major de @types/node tiene que seguir a la de engines.node (^22).
      # Dependabot no lee engines y trata @types/node como un paquete más, así
      # que hay que bloquear la major a mano y subirla al migrar de runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps-cms)'
