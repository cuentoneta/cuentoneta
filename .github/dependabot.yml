version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Martes para esquivar el pico de PRs de Dependabot de los lunes.
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps-ci)'

  # package-ecosystem: npm es el valor correcto para pnpm: Dependabot no tiene
  # ecosystem "pnpm"; detecta pnpm-lock.yaml y respeta packageManager.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      # Los sets de íconos declaran a @ng-icons/core como peer de su misma
      # major, así que la familia viaja junta, majors incluidas. Va antes de
      # minor-and-patch porque Dependabot asigna cada paquete al primer grupo
      # que lo matchea.
      ng-icons:
        patterns:
          - '@ng-icons/*'
        update-types:
          - major
          - minor
          - patch
      # En una 0.x la minor de satori puede cambiar el render de la imagen OG:
      # cada salto llega en su propio PR para revisarlo aparte.
      satori:
        patterns:
          - 'satori'
          - 'satori-html'
        update-types:
          - minor
          - patch
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # La major de @types/node tiene que seguir a la de engines.node (^22).
      # Dependabot no lee engines y trata @types/node como un paquete más, así
      # que hay que bloquear la major a mano y subirla al migrar de runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TODO(#2459): el peer de @angular/compiler-cli es ">=6.0 <6.1" y el de
      # typescript-eslint ">=4.8.4 <6.1.0". El techo es 6.1, no 7, así que
      # bloquear solo la major dejaría pasar un 6.1 que ya viola esos peers.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TODO(#2459): el Studio versiona en lockstep con la app, así que su
      # typescript sigue el mismo techo aunque no cargue el compilador de Angular.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps-cms)'
