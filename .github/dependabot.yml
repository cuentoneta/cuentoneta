version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Martes para esquivar el pico de PRs de Dependabot de los lunes.
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'chore(deps-ci)'

  # package-ecosystem: npm es el valor correcto para pnpm: Dependabot no tiene
  # ecosystem "pnpm"; detecta pnpm-lock.yaml y respeta packageManager.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # La major de @types/node tiene que seguir a la de engines.node (^22).
      # Dependabot no lee engines y trata @types/node como un paquete más, así
      # que hay que bloquear la major a mano y subirla al migrar de runtime.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TODO(#2458): satori 0.33+ declara harfbuzzjs, que resuelve su WASM con
      # __dirname y rompe la extracción de rutas del bundle ESM de servidor.
      # En una 0.x la minor es el salto que rompe, así que se bloquean las dos.
      - dependency-name: 'satori'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # TODO(#2459): el peer de @angular/compiler-cli es ">=6.0 <6.1" y el de
      # typescript-eslint ">=4.8.4 <6.1.0". El techo es 6.1, no 7, así que
      # bloquear solo la major dejaría pasar un 6.1 que ya viola esos peers.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: npm
    directory: /cms
    schedule:
      interval: weekly
      day: tuesday
    target-branch: develop
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
      # TODO(#2459): el Studio versiona en lockstep con la app, así que su
      # typescript sigue el mismo techo aunque no cargue el compilador de Angular.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    commit-message:
      prefix: 'chore(deps-cms)'
