# Deriva `author.tags` desde los tags de sus obras (`literaryWork.tags`) por unión, sin pisar
# los tags manuales.
#
# Va programado y **no** como gate, por la misma razón que los sweeps: lo que verifica es una
# propiedad del **dato**, que se vuelve falsa sin que nadie toque el repositorio, y consultarla
# exige red. Como gate haría fallar un PR por documentos que su diff no tocó.
#
# Por lo mismo, el id de este job **no debe sumarse a los required status checks** de `develop`.
name: Reconcile author tags from literary works

on:
  schedule:
    # Domingo medianoche UTC (~21:00 ART del sábado). Horario valle, sin tráfico
    # editorial concurrente.
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: reconcile-author-tags
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile author tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Reconcile author tags
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET || 'development' }}
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_STUDIO_TOKEN }}
        run: pnpm run reconcile-author-tags
