name: CI

on:
  pull_request:
  # Push a develop: corre el CI al mergear y, sobre todo, guarda el cache de Nx en la rama default.
  # Por el scoping de actions/cache, ese cache base lo pueden restaurar todos los PRs (warm desde
  # el primer push), no solo los pushes de un mismo PR.
  push:
    branches: [develop]
  # Permite dispararlo manualmente y desde `prepare-release-pr.yml`: el PR `develop → master` lo crea
  # el GITHUB_TOKEN, que por anti-recursión no gatilla `pull_request`; `workflow_dispatch` es la
  # excepción (sí corre invocado por el token), así que da señal de CI sobre `develop` para el release.
  workflow_dispatch:

# El flujo de trabajo abre un PR en borrador al terminar la implementación y le pushea los fixes de la
# review, así que un mismo PR acumula varias corridas. Sin esto, cada push encola un run nuevo sin
# cancelar el anterior y ambos compiten por runners para un resultado que ya no interesa.
#
# En `push` a `develop` NO se cancela: ese run es el que guarda el cache de Nx en la rama default (ver
# el comentario del trigger), y cancelarlo dejaría a todos los PRs sin cache base.
# El `group` incluye el evento a propósito: sin eso, el `workflow_dispatch` que dispara
# `prepare-release-pr.yml` sobre `develop` cae en el mismo grupo que el `push` a `develop`, queda
# encolado detrás de él, y un merge posterior lo cancela en silencio — justo la corrida que le da
# señal de CI al release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      # Cache de Actions sobre el cache local de Nx (.nx/cache): único mecanismo de cacheo del CI,
      # da hits entre corridas hidratando el cache que Nx escribe en disco.
      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-test-${{ github.sha }}
          restore-keys: |
            nx-cache-test-

      - name: Run Tests
        run: npx nx vitest:test

      # A) Reporte navegable (html + lcov) como artefacto descargable del workflow.
      - name: Upload coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/cuentoneta
          retention-days: 7

      # B) Comentario en el PR + job summary a partir del coverage de Vitest.
      - name: Coverage PR report
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/cuentoneta/coverage-summary.json
          json-final-path: coverage/cuentoneta/coverage-final.json

      # C) Subida a Codecov (badge + tendencia histórica). Requiere el secret CODECOV_TOKEN.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage/cuentoneta/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-lint-${{ github.sha }}
          restore-keys: |
            nx-cache-lint-

      - name: Run Linter
        run: npx nx eslint:lint

  check-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Validar el frontmatter de .claude/agents/
        run: pnpm check:agents

  stylelint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-stylelint-${{ github.sha }}
          restore-keys: |
            nx-cache-stylelint-

      - name: Run stylelint
        run: npx nx stylelint @cuentoneta/app

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-typecheck-${{ github.sha }}
          restore-keys: |
            nx-cache-typecheck-

      - name: Run typecheck
        run: npx nx typecheck

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-e2e-${{ github.sha }}
          restore-keys: |
            nx-cache-e2e-

      # Regenera environment.ts con la postura indexable de producción (SEO_INDEXABLE=true) pero sin
      # tocar las URLs: el entorno sigue siendo `development` (apiUrl/website locales, contra el server
      # SSR en localhost), lo que permite que los specs de SEO afirmen el HTML indexable del crawler.
      - name: Generate e2e environment (postura indexable, URLs locales)
        run: pnpm run config
        env:
          SEO_INDEXABLE: 'true'

      # El webServer de Playwright levanta el build SSR de producción (fidelidad con el crawler), así
      # que hay que compilarlo acá. Los e2e corren contra `staging` (espejo de producción, aislado del
      # `development` compartido que los devs mutan) para reducir la fragilidad por curación de contenido
      # (#1722); en local se usa `development` (default del .env). staging es público → no requiere token.
      - name: Build de producción para e2e (SSR real)
        run: npx nx run @cuentoneta/app:build:production
        env:
          SANITY_STUDIO_DATASET: staging
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_STUDIO_TOKEN }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

      # Replica el hook `postbuild` de package.json, que `nx run` directo no dispara (solo el lifecycle
      # de `pnpm run build`). Parchea la referencia al index en el bundle del server.
      - name: Fix index file reference (postbuild)
        run: node scripts/fix-index-file-name.mjs

      # La versión de Playwright vive en el lockfile, así que la key deriva de ahí: un bump invalida
      # el cache solo.
      - name: Cache de los browsers de Playwright
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # El cache guarda los binarios de los browsers, no los paquetes de sistema que instala
      # `--with-deps`. Por eso ante hit igual corre `install-deps`: saltear el step entero dejaría al
      # runner sin las bibliotecas nativas que los browsers necesitan para arrancar.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright system deps
        run: npx playwright install-deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      # El webServer SSR resuelve el dataset en runtime (environment.ts lee process.env), no en build:
      # se fija acá `staging` para que sea el dataset que ve el crawler. Gana sobre el `development` del
      # .env porque process.loadEnvFile() no pisa variables ya presentes en el entorno.
      - name: Run Tests
        run: npx nx run @cuentoneta/app:e2e
        env:
          SANITY_STUDIO_DATASET: staging
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: dist/.playwright/playwright-report/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-build-${{ github.sha }}
          restore-keys: |
            nx-cache-build-

      - name: Run build
        run: npx nx run @cuentoneta/app:build:production
        env:
          # Sanity / terceros. En PRs de forks los secrets llegan vacíos: para projectId/dataset
          # (públicos, ya son los defaults de set-environment.ts) caemos a esos valores para que el
          # build compile contra el dataset público de desarrollo. El token y los de terceros quedan
          # vacíos a propósito — no se exponen credenciales reales a un fork.
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET || 'development' }}
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_STUDIO_TOKEN }}
          CLARITY_TOKEN: ${{ secrets.CLARITY_TOKEN }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}

  storybook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache de Nx local
        uses: actions/cache@v6
        with:
          path: .nx/cache
          key: nx-cache-storybook-${{ github.sha }}
          restore-keys: |
            nx-cache-storybook-

      - name: Run Storybook build
        run: npx nx run @cuentoneta/app:build-storybook

  studio-build:
    runs-on: ubuntu-latest
    # Install propio, sin la composite `setup-workspace`: cms/ es un proyecto pnpm aparte
    # (lockfile propio, fuera del workspace de la raíz) y además referencia el árbol `src/`
    # de la raíz vía import relativo (schemas/contentCampaign.ts). La composite instala el
    # workspace de la raíz, que no incluye cms/node_modules: usarla no ahorraría nada.
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select pnpm as package manager
        uses: pnpm/action-setup@v6.0.10
        with:
          version: 10.12.1

      - name: Use Node.js 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install CMS dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile --ignore-scripts

      # El type-check y los tests del Studio corren en este job y no en `typecheck`/`test`: cms tiene su
      # propio árbol de node_modules y sus propias configs, y este job es el único que lo instala.
      # Van antes del build por costo: tardan segundos y el build, medio minuto.
      - name: Typecheck Sanity Studio
        working-directory: cms
        run: pnpm run typecheck

      - name: Test Sanity Studio
        working-directory: cms
        run: pnpm test

      # `sanity build` (bundler Vite/Rollup) es el gate autoritativo del *bundling* del Studio: Babel
      # transpila sin chequear tipos, así que cubre una capa distinta de la del step de type-check.
      # `--ignore-scripts` en el install saltea el postinstall que genera cms/.env (set-environment.ts),
      # así que las vars que lee sanity.cli.ts se pasan acá explícitas, con fallback a los valores
      # públicos por defecto (s4dbqkc5/development) para que corra igual en PRs de forks sin secrets.
      - name: Build Sanity Studio
        working-directory: cms
        run: pnpm exec sanity build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET || 'development' }}
          # El CLI de Sanity corre desatendido cuando CI=true (Actions ya lo setea;
          # explícito por robustez, mismo patrón que el job deploy-studio de release.yml).
          CI: 'true'
