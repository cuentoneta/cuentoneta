# Cuenta cuántos documentos guardan un campo con una forma que su schema no declara, y lo reporta en
# un issue de seguimiento.
#
# El tipo declarado gobierna la edición en el Studio, no el almacenamiento: un documento escrito por
# script o migración guarda la forma que le hayan puesto, mientras el typegen deriva del tipo
# declarado y el mapper recibe un valor que su value object rechaza. La lectura del documento falla
# entera, y sin este barrido nadie se entera hasta que alguien abre esa página.
#
# Es el hermano del barrido de campos requeridos: aquel vigila la **presencia** del dato, éste su
# **forma**. La tabla de campos va a mano porque el schema versionado colapsa la fecha con hora a una
# cadena cualquiera, así que no se puede derivar como aquél deriva la suya.
#
# Va programado y **no** como gate, por la misma razón que sus hermanos: lo que verifica es una
# propiedad del **dato**, que se vuelve falsa sin que nadie toque el repositorio, y consultarla exige
# red. Como gate haría fallar un PR por documentos que su diff no tocó.
#
# Por lo mismo, el id de este job **no debe sumarse a los required status checks** de `develop`.
#
# Se pinta de rojo solo si la herramienta se rompió (credenciales, red), nunca porque haya campos con
# forma inválida: eso es el hallazgo que el job existe para reportar.
name: Field shape sweep

on:
  schedule:
    # Lunes a las 6:55 UTC, entre `required-fields-sweep` (6:40) y `seo-index-status` (7:23), para no
    # pisar a ninguno. GitHub desactiva un `schedule` tras 60 días sin actividad en el repo; el
    # `workflow_dispatch` permite re-dispararlo a mano cuando eso pasa.
    - cron: '55 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Para crear y actualizar el issue de seguimiento. Es lo único que este job escribe: sobre el
  # contenido de Sanity nunca escribe, ni con `--apply`.
  issues: write

concurrency:
  group: field-shape-sweep
  cancel-in-progress: false

jobs:
  field-shape-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Barrer la forma de los campos vigilados
        env:
          GH_TOKEN: ${{ github.token }}
          # Producción es el dataset que importa: `staging` y `development` se sobrescriben cada noche
          # con su copia, así que un hallazgo suyo sería el mismo con un día de atraso.
          SANITY_STUDIO_DATASET: production
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          # `production` es un dataset **privado**: sin una credencial que lo alcance, cada conteo
          # devuelve `0` sin error y el barrido reportaría que no hay nada que atender. De ahí que use
          # el mismo token con el que `sync-datasets` lo lee, y que el script aborte si el dataset no
          # devuelve documentos.
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: pnpm field-shape:sweep --apply
