name: Sync datasets (production → staging + development)

# Replica el dataset `production` de Sanity hacia `staging` y `development` como espejo exacto
# (wipe + import), para que los entornos no acumulen documentos huérfanos.
#
# Después de cada import, `cms/scripts/strengthen-weak-references/` fortalece las referencias que el
# import dejó débiles: el import las fortalece con una ráfaga paralela que supera el límite de
# mutaciones por IP de Sanity y se rinde ante el 429. Ese script es además el que decide si el
# dataset quedó como espejo: verifica también que no falten documentos ni assets del origen.
#
# Prerequisitos (secrets del repo — se configuran una sola vez, ver el PR del issue #1493):
#   - SANITY_AUTH_TOKEN: robot token de manage.sanity.io con permisos para administrar datasets
#     (crear/borrar/importar) y leer `production` (que es privado).
#   - SANITY_STUDIO_PROJECT_ID: id del proyecto Sanity (s4dbqkc5). Ya existe (lo usa ci.yml).

on:
  # Sin cron propio: arranca al terminar la corrida programada de `add-next-weeks-landing-page-content.yml`,
  # que explica por qué el orden lo da el encadenado. Corre en horario diurno de Argentina y borra y
  # reimporta `staging`, que usa el e2e de CI: un PR con e2e en curso en ese momento puede fallar.
  workflow_run:
    workflows: ['Add next weeks landing page content']
    types: [completed]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Dataset(s) DESTINO a sobrescribir con un espejo exacto de production (se BORRAN y se reimportan). El origen siempre es production. Default development = dry-run seguro.'
        type: choice
        default: development
        options:
          - development
          - staging
          - both

concurrency:
  group: sync-datasets
  # No cancelar una corrida en progreso: cortar a mitad de un wipe dejaría un dataset vacío.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Sanity datasets from production
    # `workflow_run` también dispara con corridas manuales (p. ej. con `--weeks=26`) o canceladas de la
    # landing; la `if` deja pasar solo las programadas. Una landing fallida no frena el sync:
    # `production` sigue siendo la fuente de verdad y el fallo ya abre su propio issue.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest

    env:
      SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
      SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
      # El CLI de Sanity corre desatendido cuando CI=true (Actions ya lo setea; explícito por
      # robustez ante un cambio futuro del runner). El flujo además no dispara prompts: delete usa
      # --force, create pasa --visibility, e import escribe en un dataset recién creado y vacío
      # (sin conflictos de ids → sin prompt de --replace).
      CI: 'true'
      SOURCE_DATASET: production
      TARBALL: production.tar.gz
      SOURCE_NDJSON: production.ndjson
      # Umbral mínimo: un export real de producción pesa varios MB; por debajo de 50 KB asumimos un
      # export fallido o un dataset vacío y abortamos sin tocar los targets.
      MIN_TARBALL_BYTES: 51200
      # En workflow_run no hay inputs (github.event.inputs.targets = '') → el fallback deja TARGETS en
      # 'both' y la corrida semanal sincroniza ambos targets. En workflow_dispatch toma el input.
      TARGETS: ${{ github.event.inputs.targets || 'both' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select pnpm as package manager
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.12.1

      - name: Use Node.js 24
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.18.0
          cache: 'pnpm'
          cache-dependency-path: cms/pnpm-lock.yaml

      - name: Install CMS dependencies
        working-directory: cms
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Export production dataset
        working-directory: cms
        run: |
          set -euo pipefail
          pnpm exec sanity dataset export "$SOURCE_DATASET" "$TARBALL" --overwrite

      - name: Validate tarball (safety guard)
        working-directory: cms
        run: |
          set -euo pipefail
          if [ ! -f "$TARBALL" ]; then
            echo "::error::El tarball $TARBALL no existe. Se aborta para no borrar los targets." >&2
            exit 1
          fi
          actual_bytes=$(wc -c < "$TARBALL")
          if [ "$actual_bytes" -lt "$MIN_TARBALL_BYTES" ]; then
            echo "::error::El tarball pesa ${actual_bytes} bytes (< mínimo ${MIN_TARBALL_BYTES}). Posible export fallido; se aborta." >&2
            exit 1
          fi
          echo "Tarball válido: ${actual_bytes} bytes."
          # Los documentos del origen son la referencia contra la que se verifica cada destino. Extraerlos
          # antes del wipe comprueba además que el tarball se pueda leer.
          tar -xzOf "$TARBALL" --wildcards '*/data.ndjson' > "$SOURCE_NDJSON"
          if [ ! -s "$SOURCE_NDJSON" ]; then
            echo "::error::El tarball no trae un data.ndjson con documentos. Se aborta para no borrar los targets." >&2
            exit 1
          fi

      # Se sube ANTES del wipe: si un import falla tras el delete, el tarball queda disponible para
      # restaurar el dataset manualmente sin re-exportar production.
      - name: Upload tarball (recuperación manual)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-tarball
          path: cms/production.tar.gz
          retention-days: 1
          if-no-files-found: ignore

      - name: Sync targets (wipe + import)
        working-directory: cms
        run: |
          set -euo pipefail
          case "$TARGETS" in
            both) datasets="staging development" ;;
            staging) datasets="staging" ;;
            development) datasets="development" ;;
            *) echo "::error::Valor de targets no soportado: $TARGETS" >&2; exit 1 ;;
          esac
          for dataset in $datasets; do
            # Salvaguarda dura: nunca borrar/reimportar el dataset de origen (production), pase lo
            # que pase con $TARGETS o el case de arriba. production solo se lee (export), jamás se escribe.
            if [ "$dataset" = "$SOURCE_DATASET" ]; then
              echo "::error::Target prohibido: '$dataset' es el dataset de origen. Se aborta sin tocarlo." >&2
              exit 1
            fi
            echo "::group::Sync $dataset"
            pnpm exec sanity dataset delete "$dataset" --force
            # --visibility public preserva la visibilidad actual: staging y development son públicos
            # (los lee el frontend de esos entornos sin token); production es el privado.
            pnpm exec sanity dataset create "$dataset" --visibility public
            # Un import que falla no corta acá: el caso esperable es que falle al fortalecer referencias,
            # que es justo lo que repara el paso siguiente. El veredicto del dataset lo da ese paso, que
            # también falla si faltan documentos o assets.
            import_status=0
            pnpm exec sanity dataset import "$TARBALL" "$dataset" || import_status=$?
            repair_status=0
            SANITY_STUDIO_DATASET="$dataset" pnpm exec sanity exec \
              scripts/strengthen-weak-references/strengthen-weak-references.ts --with-user-token \
              -- --source="$SOURCE_NDJSON" --apply 2>&1 | tee "strengthen-$dataset.txt" || repair_status=$?
            {
              echo "## Referencias del dataset $dataset"
              echo '```'
              cat "strengthen-$dataset.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::endgroup::"
            if [ "$repair_status" -ne 0 ]; then
              echo "::error::El dataset $dataset no quedó como espejo de $SOURCE_DATASET (ver el resumen del job)." >&2
              exit 1
            fi
            if [ "$import_status" -ne 0 ]; then
              echo "::warning::El import de $dataset salió con $import_status, pero la verificación de documentos, assets y referencias lo dio por completo."
            fi
          done
          echo "Sync completado para: $datasets"

      - name: Instrucciones de recuperación ante fallo
        if: failure()
        run: |
          echo "::error::La sincronización falló. Si un dataset quedó vacío tras el delete, restauralo:" >&2
          echo "::error::  1) descargá el artefacto 'production-tarball' de este run;" >&2
          echo "::error::  2) cd cms && pnpm exec sanity dataset import production.tar.gz <target>" >&2
          echo "::error::Si el import terminó pero quedaron referencias débiles, alcanza con fortalecerlas, sin reimportar:" >&2
          echo "::error::  1) extraé los documentos del tarball: tar -xzOf production.tar.gz --wildcards '*/data.ndjson' > production.ndjson" >&2
          echo "::error::  2) cd cms && SANITY_STUDIO_DATASET=<target> pnpm exec sanity exec scripts/strengthen-weak-references/strengthen-weak-references.ts --with-user-token -- --source=<ruta a production.ndjson> [--apply]" >&2
          echo "::error::     Sin --apply solo reporta. No repara documentos ni assets faltantes: para eso hay que reimportar." >&2
