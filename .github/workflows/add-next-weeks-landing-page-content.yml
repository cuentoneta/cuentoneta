# Pre-genera en `production` los documentos de landing page de las próximas semanas.
#
# Primer paso de la cadena semanal de actualización y sincronización de contenido: cuando esta
# corrida termina, `sync-datasets.yml` arranca solo (`workflow_run`) y copia `production` a
# `staging` y `development`.
#
# Los dos workflows están encadenados y no agendados por separado porque el sync tiene que copiar
# después de que exista la landing de la semana siguiente; si copia antes, esos dos datasets se
# quedan sin ella hasta la próxima copia. Con dos crons independientes el orden no está asegurado,
# porque GitHub suele arrancar los `schedule` con horas de demora.
#
# Prerequisito (secret del repo): SANITY_AUTH_TOKEN.
# Su id no debe sumarse a los required status checks de `develop`.
name: Add next weeks landing page content

on:
  schedule:
    # Sábados 15:17 UTC: la semana ISO termina el domingo, así que el sábado ya resuelve la misma
    # "semana siguiente" que el domingo; el margen absorbe la demora de GitHub antes del lunes.
    - cron: '17 15 * * 6'
  workflow_dispatch:
    inputs:
      weeks_in_the_future:
        description: 'Cuántas semanas futuras pre-generar (1 a 26).'
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: add-next-weeks-landing-page-content
  cancel-in-progress: false

jobs:
  add-next-weeks-landing-page-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      report: ${{ steps.collect.outputs.report }}
      weeks: ${{ steps.collect.outputs.weeks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Generar las landing pages de las próximas semanas
        env:
          WEEKS: ${{ github.event.inputs.weeks_in_the_future || '1' }}
          SANITY_STUDIO_DATASET: production
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -uo pipefail
          status=0
          pnpm ops landing-pages:add-next-weeks "--weeks=${WEEKS}" 2>&1 | tee report.txt || status=$?
          {
            echo '## Generación de landing pages'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Dejar el reporte para el seguimiento
        id: collect
        if: always()
        env:
          WEEKS: ${{ github.event.inputs.weeks_in_the_future || '1' }}
        run: |
          {
            echo "weeks=${WEEKS}"
            echo 'report<<REPORT_EOF'
            tail -n 200 report.txt 2>/dev/null
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: landing-pages-report
          path: report.txt
          if-no-files-found: ignore

  notify-failure:
    needs: add-next-weeks-landing-page-content
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Abrir un issue de seguimiento
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WEEKS: ${{ needs.add-next-weeks-landing-page-content.outputs.weeks }}
          REPORT: ${{ needs.add-next-weeks-landing-page-content.outputs.report }}
        run: |
          {
            echo "La corrida programada del $(date -u +'%Y-%m-%d %H:%M') UTC falló al pre-generar las próximas ${WEEKS} semanas."
            echo
            echo "**Causa:** La tarea \`landing-pages:add-next-weeks\` terminó con error."
            echo
            echo "**Corrida:** ${RUN_URL} (el reporte completo está en el artifact \`landing-pages-report\`)."
            echo
            echo '**Reporte:**'
            echo '```'
            echo "${REPORT:-Sin reporte: la tarea no llegó a ejecutarse.}"
            echo '```'
            echo
            echo 'Hasta corregirla y volver a dispararla, `production` no tiene esas semanas y el sync que encadena esta corrida replicó el faltante a `staging` y `development`.'
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title 'Falló la generación semanal de landing pages' --body-file body.md
