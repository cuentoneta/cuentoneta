# Pre-genera en `production` los documentos de landing page de las próximas semanas.
#
# Dependencia de horario: debe correr antes de `sync-datasets.yml` (domingos 03:17 UTC). El sync
# replica `production` sobre `staging` y `development`; una landing creada después deja a esos
# datasets sin la semana vigente hasta el domingo siguiente. Si se mueve el sync, revisar este cron y
# `timeout-minutes`: la corrida tiene que terminar dentro del margen.
#
# Prerequisito (secret del repo): SANITY_AUTH_TOKEN.
# Su id no debe sumarse a los required status checks de `develop`.
name: Add next weeks landing page content

on:
  schedule:
    - cron: '47 2 * * 0'
  workflow_dispatch:
    inputs:
      weeks_in_the_future:
        description: 'Cuántas semanas futuras pre-generar (1 a 26).'
        type: string
        default: '4'
      dry_run:
        description: 'Reportar qué se crearía, sin escribir.'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: add-next-weeks-landing-page-content
  cancel-in-progress: false

jobs:
  add-next-weeks-landing-page-content:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Abortar si el runner arrancó tarde
        if: github.event_name == 'schedule'
        run: |
          # 03:02 UTC = sync (03:17) menos timeout-minutes: pasada esa hora el timeout ya no
          # garantiza terminar antes del sync.
          if [ "$(date -u +%H%M)" \> '0302' ]; then
            echo "Arranque tardío: $(date -u +%H:%M) UTC. No se genera para no correr junto al sync." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Generar las landing pages de las próximas semanas
        env:
          # En `schedule` no hay inputs y la expresión resuelve vacía, así que la corrida programada aplica.
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          WEEKS: ${{ github.event.inputs.weeks_in_the_future || '4' }}
          SANITY_STUDIO_DATASET: production
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || 's4dbqkc5' }}
          SANITY_STUDIO_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: |
          set -uo pipefail
          apply_flag=''
          if [ "$DRY_RUN" != 'true' ]; then
            apply_flag='--no-dry-run'
          fi
          status=0
          pnpm ops landing-pages:add-next-weeks "--weeks=${WEEKS}" $apply_flag 2>&1 | tee report.txt || status=$?
          {
            echo '## Generación de landing pages'
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  notify-failure:
    needs: add-next-weeks-landing-page-content
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Abrir un issue de seguimiento
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Falló la generación semanal de landing pages" \
            --body "La corrida programada falló: ${RUN_URL}. Hasta corregirla y volver a dispararla, \`production\` no tiene las próximas semanas y el sync del domingo replica ese faltante a \`staging\` y \`development\`."
